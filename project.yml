name: Cherminal
options:
  bundleIdPrefix: dev.hamulia
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # libghostty-internal-fat.a is arm64-only, so the whole app is arm64-only.
    # Without pinning this, Release (which defaults to ONLY_ACTIVE_ARCH=NO) also
    # tries to build x86_64 and the link fails — every x86_64 object in the lib
    # is dropped ("found architecture 'arm64', required architecture 'x86_64'").
    ARCHS: arm64

targets:
  Cherminal:
    type: application
    platform: macOS
    sources:
      - path: Cherminal
      # libghostty's resources (terminfo, etc.), copied wholesale into
      # Contents/Resources/ghostty as a folder reference. Without the bundled
      # xterm-ghostty terminfo, libghostty falls back to TERM=xterm-256color —
      # which has no bracketed paste (multi-line paste into agent TUIs silently
      # fails) and no kitty keyboard protocol (Shift+Enter). See the
      # GHOSTTY_RESOURCES_DIR setup in CherminalAppDelegate.
      - path: Resources/ghostty
        type: folder
        buildPhase: resources
    dependencies:
      - framework: vendor/GhosttyKit.xcframework
        embed: false
        codeSign: false
      - sdk: Carbon.framework
    postBuildScripts:
      # Bundle the vendored dtach binary into Contents/MacOS — the Apple-blessed
      # home for a standalone helper executable (notarization/Gatekeeper-safe,
      # unlike a Mach-O under Resources) — so persistent sessions work without a
      # Homebrew install. Dtach.binaryPath finds it via
      # Bundle.main.url(forAuxiliaryExecutable:) and falls back to PATH. dtach is
      # GPL-2.0-or-later, invoked as a separate executable (not linked) — see
      # vendor/dtach.NOTICE.md.
      - name: Bundle dtach
        inputFiles:
          - $(SRCROOT)/vendor/dtach
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(EXECUTABLE_FOLDER_PATH)/dtach
        script: |
          set -euo pipefail
          dst="$BUILT_PRODUCTS_DIR/$EXECUTABLE_FOLDER_PATH/dtach"
          /bin/mkdir -p "$(/usr/bin/dirname "$dst")"
          /bin/cp -f "$SRCROOT/vendor/dtach" "$dst"
          /bin/chmod +x "$dst"
          # --options runtime matches the app's hardened runtime (and works with
          # the current ad-hoc "-" identity). Notarization additionally needs
          # --timestamp + a real Developer ID identity, and this step would need to
          # re-run when that identity changes (its up-to-date check keys on
          # vendor/dtach) — both deferred with the rest of distribution.
          /usr/bin/codesign --force --options runtime --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$dst"
    info:
      path: Cherminal/Info.plist
      properties:
        CFBundleName: Cherminal
        CFBundleDisplayName: Cherminal
        CFBundleShortVersionString: "0.1.1"
        CFBundleVersion: "4"
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: ""
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        CFBundleIconName: AppIcon
    entitlements:
      path: Cherminal/Cherminal.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hamulia.Cherminal
        APP_DISPLAY_NAME: Cherminal
        # Keep the Swift module name stable as `Cherminal` even though the Debug
        # product is renamed CherminalDev — so `@testable import Cherminal`
        # works in both configs.
        PRODUCT_MODULE_NAME: Cherminal
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        OTHER_LDFLAGS: "-lstdc++"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Debug = a side-by-side "Cherminal Dev" app: separate bundle id (so
        # its data dir / Dock entry are independent) and a distinct name, so it
        # never collides with the installed release "Cherminal".
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.hamulia.Cherminal.dev
          APP_DISPLAY_NAME: Cherminal Dev
          # Distinct executable/bundle name (no space, scriptable) so the dev
          # build is fully separable from the installed "Cherminal" — killing
          # or relaunching it never touches the daily-driver app.
          PRODUCT_NAME: CherminalDev
          # Let the test bundle reach internal symbols via @testable import.
          ENABLE_TESTABILITY: YES
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: dev.hamulia.Cherminal
          APP_DISPLAY_NAME: Cherminal
          PRODUCT_NAME: Cherminal

  CherminalTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CherminalTests
    dependencies:
      - target: Cherminal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hamulia.CherminalTests
        GENERATE_INFOPLIST_FILE: YES
        # The Debug app product is renamed to CherminalDev, so the default
        # target-name-derived TEST_HOST path is wrong — point it at the real
        # Debug executable.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CherminalDev.app/Contents/MacOS/CherminalDev"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Cherminal:
    build:
      targets:
        Cherminal: all
        CherminalTests: [test]
    test:
      targets:
        - CherminalTests
