name: Belvedere
options:
  bundleIdPrefix: dev.hamulia
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"

targets:
  Belvedere:
    type: application
    platform: macOS
    sources:
      - path: Belvedere
    dependencies:
      - framework: vendor/GhosttyKit.xcframework
        embed: false
        codeSign: false
      - sdk: Carbon.framework
    info:
      path: Belvedere/Info.plist
      properties:
        CFBundleName: Belvedere
        CFBundleDisplayName: Belvedere
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: ""
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        CFBundleIconName: AppIcon
    entitlements:
      path: Belvedere/Belvedere.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hamulia.Belvedere
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        OTHER_LDFLAGS: "-lstdc++"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
